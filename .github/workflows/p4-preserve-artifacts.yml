name: P4 - FIFA ML Artifacts
# Practical-4: keep the validated model + metrics + dataset after the runner is deleted
on:
  workflow_dispatch:
    inputs:
      break_artifact_path:
        description: "Point the upload at a missing file to demonstrate if-no-files-found: error"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install ML dependencies
        run: pip install -r requirements-cicd.txt
      - name: Train FIFA tier model
        run: python train_model.py
      - name: Check ML quality gate
        run: python quality_gate.py
      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline -v
      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fifa-tier-ml-artifacts
          path: |
            ${{ inputs.break_artifact_path && 'fifa_tier_model_missing.pkl' || 'fifa_tier_model.pkl' }}
            metrics.json
            fifa_dataset.csv
          if-no-files-found: error
          retention-days: 7
