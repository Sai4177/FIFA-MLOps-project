name: P1 - First Python CI
# Practical-1: unit tests on every change to the tier logic (pure Python, no ML yet)
on:
  push:
    branches: [main]
    paths: ["tier_logic.py", "test_tier_logic.py", ".github/workflows/p1-first-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["tier_logic.py", "test_tier_logic.py", ".github/workflows/p1-first-ci.yml"]
  workflow_dispatch:
    inputs:
      inject_bug:
        description: "Deliberately break rank_to_tier to observe a FAILED CI run"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get project code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Inject deliberate bug (failure demo only)
        if: ${{ inputs.inject_bug }}
        run: sed -i 's/return "Elite"/return "Developing"/' tier_logic.py
      - name: Run automated tests
        run: python -m unittest test_tier_logic -v
